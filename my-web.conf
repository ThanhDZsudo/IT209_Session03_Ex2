server {
    listen 80;
    listen [::]:80;

    server_name _;

    # Thư mục web root chứa mã nguồn website và file 404.html
    root /var/www/my-web/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # Chỉ thị cấu hình trang lỗi 404 tùy biến
    error_page 404 /404.html;

    # Thiết lập bảo vệ file 404.html:
    # - Trỏ chính xác web root
    # - Chỉ thị 'internal' chặn truy cập trực tiếp từ client (trả về 404 nếu truy cập /404.html trực tiếp)
    location = /404.html {
        root /var/www/my-web/html;
        internal;
    }
}
